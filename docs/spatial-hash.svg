/text><text x='590' y='250' font-size='15' fill='#94a3b8' font-weight='normal' text-anchor='start'><tspan fill='#38bdf8'>●</tspan> checked here: 9</text><text x='590' y='276' font-size='15' fill='#94a3b8' font-weight='normal' text-anchor='start'><tspan fill='#94a3b8'>●</tspan> skipped: 71</text><text x='590' y='302' font-size='15' fill='#e2e8f0' font-weight='normal' text-anchor='start'></text><text x='590' y='328' font-size='15' fill='#94a3b8' font-weight='normal' text-anchor='start'>In the full app: 200 × 200 = 40 000 cells</text><text x='590' y='354' font-size='15' fill='#94a3b8' font-weight='normal' text-anchor='start'>for up to 30 000 boids.</text></svg>
