<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 340' width='960' height='340' font-family='Segoe UI, Helvetica, Arial, sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='5' markerHeight='5' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#94a3b8'/></marker><marker id='d' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='5' markerHeight='5' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#f43f5e'/></marker><marker id='g' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='5' markerHeight='5' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#4ade80'/></marker></defs><rect width='960' height='340' rx='16' fill='#0f172a'/><text x='480.0' y='40' font-size='24' fill='#e2e8f0' font-weight='bold' text-anchor='middle'>Life cycle</text><rect x='25.0' y='86' width='170' height='68' rx='12' fill='#1e293b' stroke='#4ade80' stroke-width='2'/><text x='110' y='114' font-size='17' fill='#4ade80' font-weight='bold' text-anchor='middle'>Food</text><text x='110' y='138' font-size='13' fill='#94a3b8' font-weight='normal' text-anchor='middle'>eaten and stored</text><rect x='250.0' y='86' width='190' height='68' rx='12' fill='#1e293b' stroke='#38bdf8' stroke-width='2'/><text x='345' y='114' font-size='17' fill='#38bdf8' font-weight='bold' text-anchor='middle'>Energy</text><text x='345' y='138' font-size='13' fill='#94a3b8' font-weight='normal' text-anchor='middle'>food → energy over time</text><rect x='485.0' y='86' width='230' height='68' rx='12' fill='#1e293b' stroke='#f59e0b' stroke-width='2'/><text x='600' y='114' font-size='17' fill='#f59e0b' font-weight='bold' text-anchor='middle'>Breed</text><text x='600' y='138' font-size='13' fill='#94a3b8' font-weight='normal' text-anchor='middle'>age > 20, energy > 1000, mate</text><rect x='750.0' y='86' width='190' height='68' rx='12' fill='#1e293b' stroke='#f59e0b' stroke-width='2'/><text x='845' y='114' font-size='17' fill='#f59e0b' font-weight='bold' text-anchor='middle'>Child</text><text x='845' y='138' font-size='13' fill='#94a3b8' font-weight='normal' text-anchor='middle'>mutated genes, gen + 1</text><rect x='250.0' y='216' width='190' height='68' rx='12' fill='#1e293b' stroke='#f43f5e' stroke-width='2'/><text x='345' y='244' font-size='17' fill='#f43f5e' font-weight='bold' text-anchor='middle'>Starve</text><text x='345' y='268' font-size='13' fill='#94a3b8' font-weight='normal' text-anchor='middle'>energy 0 → health drops</text><rect x='485.0' y='216' width='230' height='68' rx='12' fill='#1e293b' stroke='#f43f5e' stroke-width='2'/><text x='600' y='244' font-size='17' fill='#f43f5e' font-weight='bold' text-anchor='middle'>Die</text><text x='600' y='268' font-size='13' fill='#94a3b8' font-weight='normal' text-anchor='middle'>health 0 or age 90</text><line x1='197.0' y1='120.0' x2='247.0' y2='120.0' stroke='#94a3b8' stroke-width='2.5' marker-end='url(#a)'/><line x1='442.0' y1='120.0' x2='482.0' y2='120.0' stroke='#94a3b8' stroke-width='2.5' marker-end='url(#a)'/><line x1='717.0' y1='120.0' x2='747.0' y2='120.0' stroke='#94a3b8' stroke-width='2.5' marker-end='url(#a)'/><line x1='345.0' y1='156.0' x2='345.0' y2='212.0' stroke='#f43f5e' stroke-width='2.5' marker-end='url(#d)'/><line x1='442.0' y1='250.0' x2='482.0' y2='250.0' stroke='#f43f5e' stroke-width='2.5' marker-end='url(#d)'/><path d='M 600 286 L 600 312 L 110 312 L 110 158' fill='none' stroke='#4ade80' stroke-width='2.5' stroke-dasharray='6 5' marker-end='url(#g)'/><text x='130' y='304' font-size='13' fill='#4ade80' font-weight='normal' text-anchor='start'>Food on Death: the body becomes food</text><path d='M 845 84 C 845 45, 600 45, 600 82' fill='none' stroke='#94a3b8' stroke-width='2' stroke-dasharray='4 4' marker-end='url(#a)'/><text x='722' y='40' font-size='12' fill='#94a3b8' font-weight='normal' text-anchor='middle'>grows up, eats, breeds</text></svg>
